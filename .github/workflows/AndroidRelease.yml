name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: carlonluca/qt-dev:6.8.2
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build APK
      run: |
        mkdir build && cd build
        
        /opt/qt/6.8.2/android_arm64_v8a/bin/qt-cmake .. \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-34 \
          -DCMAKE_BUILD_TYPE=Release
        
        cmake --build . --parallel
        cmake --build . --target apk
    
    - name: Create debug keystore
      run: |
        mkdir -p /tmp/keystore
        
        keytool -genkey -v \
          -keystore /tmp/keystore/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Debug"
    
    - name: Sign APK with apksigner (V2+ signature)
      run: |
        # Найти APK
        APK_PATH=$(find build -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        ls -lh "$APK_PATH"
        
        # Найти apksigner
        APKSIGNER=$(find /opt/android-sdk/build-tools -name "apksigner" -type f | sort -V | tail -1)
        
        if [ -z "$APKSIGNER" ]; then
          echo "ERROR: apksigner not found!"
          echo "Available build-tools:"
          ls -la /opt/android-sdk/build-tools/ || echo "No build-tools"
          exit 1
        fi
        
        echo "Using apksigner: $APKSIGNER"
        
        # ВАЖНО: Сначала zipalign (требование для V2+)
        ZIPALIGN=$(find /opt/android-sdk/build-tools -name "zipalign" -type f | sort -V | tail -1)
        
        if [ -n "$ZIPALIGN" ]; then
          echo "Aligning APK..."
          ALIGNED_APK="${APK_PATH%.apk}-aligned.apk"
          $ZIPALIGN -v -p 4 "$APK_PATH" "$ALIGNED_APK"
          mv "$ALIGNED_APK" "$APK_PATH"
        fi
        
        # Подписать с V1+V2+V3+V4
        echo "Signing with V2+ signature scheme..."
        $APKSIGNER sign \
          --ks /tmp/keystore/debug.keystore \
          --ks-pass pass:android \
          --key-pass pass:android \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --v4-signing-enabled true \
          "$APK_PATH"
        
        # Проверить подпись
        echo ""
        echo "=== VERIFYING SIGNATURE ==="
        $APKSIGNER verify --verbose "$APK_PATH"
        
        # Переименовать для ясности
        SIGNED_APK="${APK_PATH%.apk}-v2signed.apk"
        mv "$APK_PATH" "$SIGNED_APK"
        
        echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT
      id: sign_apk
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-player-arm64-${{ github.ref_name }}
        path: ${{ steps.sign_apk.outputs.apk_path }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ steps.sign_apk.outputs.apk_path }}
        name: "Music Player ${{ github.ref_name }}"
        body: |
          ## Music Player ${{ github.ref_name }}
          
          Android APK (ARM64, V2+ signed for Android 15)
          
          **Requirements:**
          - Android 9.0+ (API 28+)
          - ARM64 device (64-bit)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
