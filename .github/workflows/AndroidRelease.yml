name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: carlonluca/qt-dev:6.8.2
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Multi-ABI APK
      run: |
        mkdir build && cd build
    
        /opt/qt/6.8.2/android_arm64_v8a/bin/qt-cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DQT_ANDROID_ABIS="armeabi-v7a;arm64-v8a;x86;x86_64"
    
        cmake --build . --parallel
        cmake --build . --target apk
    
    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find build -name "*.apk" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-player-${{ github.ref_name }}
        path: ${{ steps.find_apk.outputs.apk_path }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
