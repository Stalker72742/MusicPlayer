name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: carlonluca/qt-dev:6.8.2
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug - Check Qt installation
      run: |
        echo "=== Checking /opt directory ==="
        ls -la /opt/ || echo "/opt not found"
        
        echo "=== Looking for qt-cmake ==="
        find /opt -name "qt-cmake" 2>/dev/null || echo "qt-cmake not found"
        
        echo "=== Checking Qt bin directories ==="
        find /opt -type d -name "bin" 2>/dev/null || echo "No bin dirs found"
    
    - name: Build APK
      run: |
        # Найти qt-cmake автоматически
        QT_CMAKE=$(find /opt -name "qt-cmake" -type f | head -1)
        
        if [ -z "$QT_CMAKE" ]; then
          echo "ERROR: qt-cmake not found!"
          exit 1
        fi
        
        echo "Found qt-cmake at: $QT_CMAKE"
        
        mkdir build && cd build
        
        $QT_CMAKE .. \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release
        
        cmake --build . --parallel
        cmake --build . --target apk
    
    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find build -name "*.apk" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-player-${{ github.ref_name }}
        path: ${{ steps.find_apk.outputs.apk_path }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
